<div class="card" data-card-id="card-10">
<style>
.card[data-card-id="card-10"] .inrow { display:flex; align-items:center; gap:22px; }
.card[data-card-id="card-10"] .node { display:flex; align-items:center; gap:16px; padding:22px 30px; border-radius:20px; background:var(--panel); border:2px solid var(--line); font:700 34px/1 'Inter'; }
.card[data-card-id="card-10"] .acc-n { font-family:'JetBrains Mono'; color:var(--acc); border-color:var(--acc); }
.card[data-card-id="card-10"] .plus { font:700 48px/1 'Inter'; color:var(--muted); }
.card[data-card-id="card-10"] .down { color:var(--acc); align-self:center; height:70px; }
.card[data-card-id="card-10"] .skillbox { padding:26px; border-radius:28px; border:3px solid var(--acc); background:var(--panel); display:flex; flex-direction:column; gap:14px; }
.card[data-card-id="card-10"] .sbh { font-size:24px; letter-spacing:.2em; color:var(--acc); }
.card[data-card-id="card-10"] .layer { display:flex; align-items:center; gap:20px; padding:20px 24px; border-radius:16px; background:var(--panel-2); font:700 34px/1.2 'Inter'; }
.card[data-card-id="card-10"] .layer.best { background:var(--acc); color:#141312; }
.card[data-card-id="card-10"] .ln { font-size:26px; opacity:.75; }
.card[data-card-id="card-10"] .agent { align-self:flex-start; }

.card[data-card-id="card-10"] { --acc: var(--accent-2); }
</style>
<div class="root">
<div class="kicker" id="card-10-kicker" data-anim="fade-in" data-anim-at="0.2" data-anim-duration="0.4">Claude trabaja</div>
<h1 class="title" id="card-10-title" data-anim="kinetic-chars" data-anim-at="0.3" data-anim-duration="0.6" data-anim-stagger="0.025" data-anim-pattern="pop"><span class="w"><span class="char">C</span><span class="char">l</span><span class="char">a</span><span class="char">u</span><span class="char">d</span><span class="char">e</span></span> <span class="w"><span class="char">a</span><span class="char">r</span><span class="char">m</span><span class="char">a</span></span> <span class="w"><span class="char">l</span><span class="char">a</span></span> <span class="w"><span class="char">s</span><span class="char">k</span><span class="char">i</span><span class="char">l</span><span class="char">l</span></span></h1>
<div class="inrow">
  <div class="node" id="card-10-n1" data-anim="slide-in" data-anim-at="1.2" data-anim-duration="0.5" data-anim-from="left" data-anim-distance="60"><span class="ico" style="width:48px;height:48px;color:var(--muted)"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"><path d="M6 16a4 4 0 0 1 4-4h14l6 7h24a4 4 0 0 1 4 4v27a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z"/><path d="M6 26h52"/></svg></span><span>Material</span></div>
  <span class="plus" id="card-10-plus" data-anim="fade-in" data-anim-at="8.7" data-anim-duration="0.3">+</span>
  <div class="node mono acc-n" id="card-10-n2" data-anim="scale-pop" data-anim-at="8.9" data-anim-duration="0.5">/skill-creator</div>
</div>
<div class="down" id="card-10-down" data-anim="mask-reveal" data-anim-at="10.5" data-anim-duration="0.5" data-anim-direction="top"><span class="ico" style="width:70px;height:70px;"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8v46M18 40l14 14 14-14"/></svg></span></div>
<div class="skillbox">
  <div class="sbh mono">SKILL</div>
  <div class="layer" id="card-10-l1" data-anim="slide-in" data-anim-at="14.3" data-anim-duration="0.45" data-anim-from="bottom" data-anim-distance="40"><span class="ln mono">1</span>Estructura de prompt</div>
  <div class="layer" id="card-10-l2" data-anim="slide-in" data-anim-at="17.7" data-anim-duration="0.45" data-anim-from="bottom" data-anim-distance="40"><span class="ln mono">2</span>Las partes de la skill</div>
  <div class="layer best" id="card-10-l3" data-anim="slide-in" data-anim-at="21.7" data-anim-duration="0.45" data-anim-from="bottom" data-anim-distance="40"><span class="ln mono">3</span>La mejor prompt</div>
</div>
<div class="badge agent" id="card-10-agent" data-anim="scale-pop" data-anim-at="26.7" data-anim-duration="0.5"><span class="ico" style="width:44px;height:44px;"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 30a18 18 0 0 1 32-11l4 5"/><path d="M50 12v12H38"/><path d="M50 34a18 18 0 0 1-32 11l-4-5"/><path d="M14 52V40h12"/></svg></span><span>Repetible: actúa como un agente</span></div>
</div>
</div>
